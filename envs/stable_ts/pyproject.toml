[project]
name = "efa-env-stable-ts"
version = "0.1.0"
description = "Interpreter for aligners/stable_ts.py"
requires-python = ">=3.11,<3.12"
# numpy<2 because torch 2.4 is built against 1.x.
dependencies = [
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "stable-ts==2.19.1",
    "faster-whisper==1.2.1",
    "soundfile",
    "numpy<2",
]

[tool.uv]
package = false
