[project]
name = "efa-env-ctc"
version = "0.1.0"
description = "Interpreter for aligners/ctc.py: wav2vec2-hebrew and mms"
requires-python = ">=3.11,<3.13"
dependencies = [
    # torchaudio 2.9 removed functional.forced_align, which ctc.py is built on.
    "torch>=2.4,<2.9",
    "torchaudio>=2.4,<2.9",
    "transformers>=4.44,<5",
    "uroman>=1.3",
    "soundfile>=0.12",
    "scipy>=1.11",
    "numpy>=1.26",
]

[tool.uv]
package = false
